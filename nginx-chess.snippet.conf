# =====================================================================
# nginx-Direktiven für /games/chess/  —  NICHT in den Web-Ordner legen!
# Inhalt in die Site-Config (default.conf) des Containers web_nginx
# übernehmen, dann: nginx -t && nginx -s reload
# =====================================================================

# 1) Spiel-JSONs schützen: kein direkter Web-Zugriff auf online_games/.
#    Zugriff läuft ausschließlich serverseitig über chess_online.php.
#    ^~ hat Vorrang vor regex-locations (z.B. der PHP-Regel).
location ^~ /games/chess/online_games/ {
    deny all;
    return 404;
}

# 1b) Nutzerdaten (Konten/Sessions/Einladungscode) schützen — zwingend!
location ^~ /games/chess/auth_data/ {
    deny all;
    return 404;
}

# 2) Korrekter MIME-Type für WebAssembly (Stockfish).
#    Nur nötig, falls eure mime.types 'application/wasm' noch nicht kennt.
#    Alternativ global in mime.types ergänzen:  application/wasm  wasm;
location ~* ^/games/chess/.*\.wasm$ {
    default_type application/wasm;
    add_header Cache-Control "public, max-age=604800";
}

# 3) Verzeichnislisting für den Chess-Ordner aus (in nginx ohnehin Default).
location /games/chess/ {
    autoindex off;
}

# ---------------------------------------------------------------------
# OPTIONAL — nur falls ihr eine MEHRFÄDIGE Stockfish-Variante nutzt,
# die SharedArrayBuffer braucht. Aktiviert "cross-origin isolation".
# Achtung: Dann müssen ALLE eingebundenen Ressourcen same-origin bzw.
# CORP-konform sein, sonst laden sie nicht mehr. Für die aktuelle
# Single-Origin-App unkritisch, aber im Zweifel weglassen.
